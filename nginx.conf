server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Giữ khớp với public/_headers. Khối location có add_header riêng nên phải lặp lại bằng include
  include /etc/nginx/conf.d/security-headers.inc;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json;

  # Service worker, manifest, index: không cache để cập nhật ngay
  location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri =404;
  }

  # Asset có hash: cache lâu
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri =404;
  }

  # Dữ liệu điểm cứu hộ: sửa file là thấy ngay
  location /data/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
